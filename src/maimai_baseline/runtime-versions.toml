# Single maintenance point for release numbers and compatibility.
# Store decimal strings; compare integer hundredths, never floats.
# major: next integer; minor: next tenth; patch: next hundredth; carry normally.
# Every change updates this file and reviews all three inclusive ranges.
# Source/checkpoint hashes are provenance, never runtime admission criteria.
current = "43.02"

[bump]
major = 100
minor = 10
patch = 1

[supported.training]
min = "39.00"
max = "43.02"
[supported.inference]
min = "39.00"
max = "43.02"
[supported.materialize]
min = "15.00"
max = "43.02"

